name: Secret Scan

on:
  push:
    branches: [v5-chatgpt-security, v5-production-hardening]
  pull_request:
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          curl --fail --silent --show-error --location --output "${ARCHIVE}" "${URL}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${ARCHIVE}" | sha256sum --check -
          tar -xzf "${ARCHIVE}" gitleaks
          ./gitleaks version

      - name: Scan git history for secrets
        shell: bash
        run: |
          set +e
          ./gitleaks git --redact=100 --no-banner --report-format json --report-path gitleaks-report.json .
          STATUS=$?
          set -e
          if [ -s gitleaks-report.json ]; then
            node scripts/security/summarize-gitleaks.mjs gitleaks-report.json
          fi
          rm -f gitleaks-report.json
          exit "$STATUS"
