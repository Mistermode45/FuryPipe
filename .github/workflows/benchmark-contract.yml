name: Benchmark Contract

on:
  push:
    branches: [v5-codex-review-clean, v5-chatgpt-security, v5-production-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Validate result schema JSON
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('bench/v5/result.schema.json','utf8')); console.log('result schema JSON: PASS')"
      - name: Run benchmark contract self-test
        run: node bench/v5/self-test.mjs
      - name: Install the exact dependency graph for the beta envelope
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node for the beta envelope
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Build the exact beta candidate
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Run bounded offline beta FuryBench envelope
        run: pnpm run benchmark:beta -- --iterations=3 --warmup=1
