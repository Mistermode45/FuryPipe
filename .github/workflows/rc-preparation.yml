name: RC Preparation Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FURYPIPE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build exact candidate
        run: pnpm run build

      - name: Produce local versioned tarball upgrade and rollback evidence
        run: pnpm run validation:upgrade-rollback

      - name: Produce non-destructive RC preparation evidence
        run: node scripts/rc-preparation.mjs

      - name: Upload exact RC preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: furypipe-rc-preparation-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/rc-preparation/
          if-no-files-found: warn
          retention-days: 30
