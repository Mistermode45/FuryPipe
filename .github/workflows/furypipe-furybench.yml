name: FuryPipe FuryBench Baseline Comparison

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: furypipe-furybench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FURYPIPE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      FURYPIPE_VALIDATION_OUTPUT_DIR: artifacts/final-validation
      FURYPIPE_BENCHMARK_BASELINE_REF: 24a2f7030c9fb7340229140f67e653688d5d039a
    steps:
      - name: Checkout exact candidate and historical baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm

      - name: Install candidate dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build candidate
        run: pnpm run build

      - name: Compare same-runner compatible beta baseline with candidate
        run: pnpm run validation:furybench

      - name: Upload FuryBench comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: furypipe-furybench-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/final-validation/
          if-no-files-found: warn
          retention-days: 30
