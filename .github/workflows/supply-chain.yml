name: Supply Chain

on:
  pull_request:
    branches: [v5-production-hardening]
  push:
    branches: [v5-chatgpt-security, v5-production-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@284c089a1c4d8e8673b7398cdb8df358a9de47ad
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  sbom:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Export repository SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq '.sbom' > sbom.spdx.json
          test -s sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fury-pipe-sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
