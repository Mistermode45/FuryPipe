name: License Compliance

on:
  push:
    branches: [v5-chatgpt-compliance, v5-production-hardening]
  pull_request:
    branches: [v5-production-hardening, v5-chatgpt-post-codex-integrity-final-validation]
  schedule:
    - cron: '11 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install frozen dependency graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate dependency license inventory
        run: |
          pnpm licenses list --json > licenses.raw.json
          node scripts/security/license-report.mjs licenses.raw.json licenses.summary.json

      - name: Upload license evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: furypipe-license-report-${{ matrix.os }}
          path: |
            licenses.raw.json
            licenses.summary.json
          if-no-files-found: error
          retention-days: 30
