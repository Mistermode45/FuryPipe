name: Hosted MCP Conformance

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      target_url:
        description: Public HTTPS FuryPipe MCP endpoint, exact /mcp path
        required: true
        type: string
      server_timeout_ms:
        description: Timeout configured on the hosted FuryPipe MCP fixture
        required: true
        default: '1500'
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-mcp-conformance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  conformance:
    name: External Inspector conformance
    if: >-
      github.actor == github.repository_owner &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'hosted-mcp-conformance' &&
          github.event.pull_request.user.login == github.repository_owner &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FURYPIPE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      FURYPIPE_ALLOW_HOSTED_MCP_CONFORMANCE: '1'
      FURYPIPE_HOSTED_MCP_URL: ${{ inputs.target_url || vars.FURYPIPE_HOSTED_MCP_TARGET_URL }}
      FURYPIPE_HOSTED_MCP_SERVER_TIMEOUT_MS: ${{ inputs.server_timeout_ms || vars.FURYPIPE_HOSTED_MCP_SERVER_TIMEOUT_MS || '1500' }}
      FURYPIPE_HOSTED_MCP_CLIENT_BOUNDARY: github-hosted-runner
      FURYPIPE_HOSTED_MCP_OUTPUT_DIR: artifacts/hosted-mcp-conformance

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Validate exact candidate
        run: |
          pnpm run typecheck
          pnpm run build

      - name: Require hosted target and secret
        env:
          FURYPIPE_HOSTED_MCP_BEARER_TOKEN: ${{ secrets.FURYPIPE_HOSTED_MCP_BEARER_TOKEN }}
        run: |
          if [ -z "$FURYPIPE_HOSTED_MCP_URL" ]; then
            echo "::error::Set repository variable FURYPIPE_HOSTED_MCP_TARGET_URL for label-triggered runs, or use the workflow_dispatch target_url input."
            exit 1
          fi
          if [ -z "$FURYPIPE_HOSTED_MCP_BEARER_TOKEN" ]; then
            echo "::error::Repository secret FURYPIPE_HOSTED_MCP_BEARER_TOKEN is required."
            exit 1
          fi

      - name: Run external hosted MCP conformance
        env:
          FURYPIPE_HOSTED_MCP_BEARER_TOKEN: ${{ secrets.FURYPIPE_HOSTED_MCP_BEARER_TOKEN }}
          FURYPIPE_GITHUB_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: pnpm run hosted-mcp:conformance

      - name: Upload source-bound hosted MCP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: furypipe-hosted-mcp-conformance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/hosted-mcp-conformance/hosted-mcp-conformance.json
            artifacts/hosted-mcp-conformance/hosted-mcp-conformance.json.sha256
          if-no-files-found: warn
          retention-days: 30
