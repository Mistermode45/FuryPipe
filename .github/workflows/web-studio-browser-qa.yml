name: Web Studio Browser QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-studio-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FURYPIPE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Locate runner Chromium
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CHROME_BIN=$(command -v "$candidate")" >> "$GITHUB_ENV"
              "$candidate" --version
              exit 0
            fi
          done
          echo "No Chromium/Chrome binary found on ubuntu-24.04 runner" >&2
          exit 1

      - name: Run Web Studio real Chromium matrix
        run: pnpm exec tsx scripts/web-studio-browser-qa.ts

      - name: Upload Web Studio browser QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: furypipe-web-studio-browser-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/web-studio-browser-qa/
          if-no-files-found: warn
          retention-days: 30
