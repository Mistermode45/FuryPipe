name: Security

on:
  push:
    branches: [v5-chatgpt-security, v5-production-hardening, v5-codex-review-clean]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1cf8f518e1ad217271451b975391e639ea196e55
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@1cf8f518e1ad217271451b975391e639ea196e55
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@284c089a1c4d8e8673b7398cdb8df358a9de47ad
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependency graph without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate CycloneDX SBOM
        run: |
          npm sbom --sbom-format cyclonedx > sbom.cdx.json
          node -e "const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync('sbom.cdx.json','utf8')); if(x.bomFormat!=='CycloneDX'||!Array.isArray(x.components)) process.exit(1)"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: furypipe-sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
