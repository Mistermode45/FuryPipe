name: Cross-Browser QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FURYPIPE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Install browsers pinned to Playwright 1.63.0
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run Dashboard 48-case and Web Studio 120-case cross-engine QA
        run: pnpm run browser:qa

      - name: Upload source-bound cross-browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: furypipe-cross-browser-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/cross-browser-qa/
          if-no-files-found: warn
          retention-days: 30
