services:
  furypipe:
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${FURYPIPE_PORT:-48721}:48721"
    environment:
      - FURYPIPE_MODELS
      - FURYPIPE_DISABLE
      - FURYPIPE_UPSTREAM
      - ANTHROPIC_UPSTREAM
      - OPENAI_UPSTREAM
      - OPENAI_API_KEY
      - OPENAI_MODELS
      - CLOUDFLARE_MODELS
      - CLOUDFLARE_ACCOUNT_ID
      - CLOUDFLARE_API_TOKEN
      - FURYPIPE_PROVIDER
      - FURYPIPE_GATEWAY_BASE_URL
      - FURYPIPE_GATEWAY_HEADERS
      - FURYPIPE_GPT_PROFILES
      - FURYPIPE_DUMP_DIR
      - FURYPIPE_DEBUG_CAPTURE_4XX
    volumes:
      - furypipe-data:/data

volumes:
  furypipe-data:
